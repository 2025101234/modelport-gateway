<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="ModelPort">
  <title>ModelPort</title>
  <defs>
    <linearGradient id="mp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3f8f"/>
      <stop offset="0.55" stop-color="#2656c9"/>
      <stop offset="1" stop-color="#3f7ae0"/>
    </linearGradient>
    <linearGradient id="mp-lane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- 圆角方板：侧边栏里就是按这个形状裁切的。 -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#mp-bg)"/>

  <!-- 三条车道从左侧汇入右侧一个端口：三条车道 = 三类模型来源，
       端口 = 它们共用的那一个本地地址。 -->
  <g fill="none" stroke="url(#mp-lane)" stroke-width="7" stroke-linecap="round">
    <path d="M22 42 H48 Q60 42 60 54 V64"/>
    <path d="M22 64 H60"/>
    <path d="M22 86 H48 Q60 86 60 76 V64"/>
  </g>

  <!-- 端口本体：方槽而不是圆点，读起来是「接口」而非泛泛的节点。 -->
  <rect x="66" y="50" width="36" height="28" rx="9" fill="#ffffff"/>
  <rect x="74" y="58" width="20" height="12" rx="4" fill="#2656c9"/>

  <!-- 一个出站刻度：调用从端口离开。 -->
  <path d="M104 64 H114" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
</svg>
